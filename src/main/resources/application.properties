spring.application.name=vetcare

# Configuración de la Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vetcare_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de JWT
jwt.secret=${JWT_SECRET:unaClaveSecretaMuyLargaYSeguraDeAlMenos32CaracteresParaDesarrollo}
jwt.expiration=${JWT_EXPIRATION:86400000}